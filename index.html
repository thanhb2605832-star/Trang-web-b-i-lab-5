<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lợi ích của công nghệ số trong học tập</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #18314a;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    header {
      padding: 40px 16px;
      background: linear-gradient(115deg, #eff8ef, #e6f3f8, #dce9ff);
      color: #345d96;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.5rem);
    }

    main {
      width: min(100% - 32px, 1000px);
      margin: 0 auto;
    }

    section {
      padding: 40px 0;
      text-align: center;
    }

    section + section {
      border-top: 1px solid #d8e5df;
    }

    h2 {
      color: #345d96;
    }

    .infographic {
      display: block;
      width: 100%;
      max-width: 768px;
      height: auto;
      margin: 24px auto 0;
    }

    .video {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      margin: 24px auto 0;
    }

    .video iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      padding: 20px;
      background: #eaf6f0;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Lợi ích của công nghệ số trong học tập</h1>
  </header>

  <main>
    <section>
      <h2>Infographic</h2>
      <img
        class="infographic"
        src="./Lab05_Ex2.1.png"
        alt="Infographic về lợi ích của công nghệ số trong học tập"
      >
    </section>

    <section>
      <h2>Video YouTube Lab 5</h2>
      <div class="video">
        <iframe referrerpolicy="strict-origin-when-cross-origin"
          src="https://www.youtube-nocookie.com/embed/lMZbmvlLVVM"
          title="Video về công nghệ số trong học tập"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen;allowfullscreen
referrerpolicy="strict-origin-when-cross-origin"
></iframe>
        ></iframe>
      </div>
    </section>
  </main>

  <footer>
    Infographic tạo bởi Canva AI, hình ảnh từ Unsplash và trang HTML với sự hỗ trợ từ GitHub Copilot.
  </footer>
</body>
</html>
